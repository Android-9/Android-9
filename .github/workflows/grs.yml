name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # Runs once daily at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&theme=dark&hide_border=false&include_all_commits=true&count_private=true
          path: profile/stats.svg
          token: ${{ secrets.TOKEN }}

      - name: Generate stats card gruvbox
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&theme=synthwave&hide_border=false&include_all_commits=true&count_private=true
          path: profile/stats-synthwave.svg
          token: ${{ secrets.TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&theme=dark&hide_border=false&include_all_commits=true&count_private=true&layout=normal
          path: profile/top-langs.svg
          token: ${{ secrets.TOKEN }}

      - name: Generate top languages card compact
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&theme=dark&hide_border=false&include_all_commits=true&count_private=true&layout=compact
          path: profile/top-langs-compact.svg
          token: ${{ secrets.TOKEN }}

      - name: Generate top languages card donut
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&theme=dark&hide_border=false&include_all_commits=true&count_private=true&layout=donut
          path: profile/top-langs-donut.svg
          token: ${{ secrets.TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&theme=dark&hide_border=false&include_all_commits=true&count_private=true&layout=donut-vertical
          path: profile/top-langs-donut-vertical.svg
          token: ${{ secrets.TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&theme=dark&hide_border=false&include_all_commits=true&count_private=true&layout=pie
          path: profile/top-langs-pie.svg
          token: ${{ secrets.TOKEN }}

      - name: Generate pin card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=android-9&repo=overthewire-leviathan
          path: profile/pin-android-9-overthewire-leviathan.svg
          token: ${{ secrets.TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
